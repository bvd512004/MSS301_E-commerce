name: bookmart

services:
  mysql:
    image: mysql:8.4
    container_name: bookmart-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - bookmart-net

  discovery-server:
    build: ./discovery-server
    container_name: bookmart-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8761"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s
    networks:
      - bookmart-net

  user-service:
    build: ./services/user-service
    container_name: bookmart-user
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bookmart_user?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: bookmart
      SPRING_DATASOURCE_PASSWORD: "BookMart@2026"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - bookmart-net

  product-service:
    build: ./services/product-service
    container_name: bookmart-product
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bookmart_product?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: bookmart
      SPRING_DATASOURCE_PASSWORD: "BookMart@2026"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8082"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - bookmart-net

  order-service:
    build: ./services/order-service
    container_name: bookmart-order
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bookmart_order?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: bookmart
      SPRING_DATASOURCE_PASSWORD: "BookMart@2026"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8083"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - bookmart-net

  api-gateway:
    build: ./api-gateway
    container_name: bookmart-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - bookmart-net

networks:
  bookmart-net:
    driver: bridge

volumes:
  mysql_data:
