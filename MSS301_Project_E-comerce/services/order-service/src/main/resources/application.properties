spring.application.name=order-service
server.port=8083

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bookmart_order?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookmart}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:BookMart@2026}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
